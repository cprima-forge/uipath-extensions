[project]
name = "cprima-forge-uipath-extensions"
version = "0.0.5"
description = "Production-ready extensions for the UiPath Python SDK - bridges critical API gaps for assets, jobs, queues, processes, schedules, libraries, tasks, folders, and storage"
readme = "README.md"
license = "CC-BY-4.0"
authors = [{ name = "Christian Prior-Mamulyan" }]
requires-python = ">=3.11"
dependencies = ["uipath>=2.1.111"]

[project.urls]
Homepage = "https://github.com/cprima-forge/uipath-extensions"
Repository = "https://github.com/cprima-forge/uipath-extensions"
Issues = "https://github.com/cprima-forge/uipath-extensions/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
